name: Build DEYN APK

on:
  push:
    paths:
      - "deyn-apk-project (1).zip"
      - ".github/workflows/build-deyn-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout handoff files
        uses: actions/checkout@v4

      - name: Inspect uploaded source archive
        run: |
          unzip -l "deyn-apk-project (1).zip" | head -80
          mkdir -p extracted
          unzip -q "deyn-apk-project (1).zip" -d extracted
          APP_PACKAGE="$(find extracted -type f -path '*/deyn-app/package.json' -print -quit)"
          if [ -z "$APP_PACKAGE" ]; then
            echo "Could not find deyn-app/package.json in the uploaded archive."
            find extracted -maxdepth 4 -type f -name package.json -print
            exit 1
          fi
          echo "APP_DIR=$(dirname "$APP_PACKAGE")" >> "$GITHUB_ENV"
          echo "Found app at: $(dirname "$APP_PACKAGE")"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extracted/**/deyn-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies and prepare Android project
        run: |
          cd "$APP_DIR"
          npm install
          if [ -f scripts/fetch_fonts.py ]; then python3 scripts/fetch_fonts.py; fi
          npx cap add android
          bash scripts/prepare-android.sh
          npx cap sync android

      - name: Build debug APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deyn-debug-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
